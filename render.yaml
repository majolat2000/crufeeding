services:
  - type: web
    name: crufeeding-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: sh -c "rm -rf node_modules && npm install && npx prisma generate && tsc -p tsconfig.json"
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
