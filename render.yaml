services:
  - type: web
    name: crufeeding-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss --schema=./prisma/schema.prisma && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=256 --optimize-for-size
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: crufeeding-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: crufeeding-db
    plan: free
    databaseName: crufeeding
    user: crufeeding
