services:
  - type: web
    name: crufeeding-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # set to your MongoDB Atlas URI: mongodb+srv://user:pass@cluster.mongodb.net/crawford_feeding
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NEXT_PUBLIC_API_URL
        sync: false
