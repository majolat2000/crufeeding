<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Position</title>
    <style>
        .container {
            position: relative;
            width: 400px;
            height: 300px;
            background: #f0f0f0;
            border: 1px solid #ccc;
        }
        .box {
            position: absolute;
            top: 50px;
            left: 100px;
            width: 100px;
            height: 100px;
            background: #4CAF50;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">Positioned Box</div>
    </div>
</body>
</html></div>
