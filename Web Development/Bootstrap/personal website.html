<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        nav {
            background-color: #34495e;
            padding: 10px;
        }
        
        nav a {
            color: white;
            margin: 0 20px;
            text-decoration: none;
            font-weight: bold;
        }
        
        nav a:hover {
            color: #3498db;
        }
        
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }
        
        .hero {
            background-color: #ecf0f1;
            padding: 60px 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        h2 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 8px;
        }
        
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Page</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="hero">
            <h2>Hello! This is my little website</h2>
            <p>I'm learning web development :)</p>
        </div>

        <div class="section">
            <h2>About Me</h2>
            <p>...</p>
        </div>

        <div class="section">
            <h2>My Work</h2>
            <p>...</p>
        </div>

    </div>

    <footer>
        <p>© 2026 - Made with love and copy-paste</p>
    </footer>

</body>
</html>
