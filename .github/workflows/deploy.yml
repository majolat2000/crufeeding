name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Deploy hook triggered (or already pending)"
          elif [ -n "${{ secrets.RENDER_DEPLOY_KEY }}" ]; then
            curl -X POST "https://api.render.com/deploy/srv-daf8o2id0e5s73bavkag?key=${{ secrets.RENDER_DEPLOY_KEY }}" || echo "Deploy hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Skipping manual curl trigger (Render auto-deploy on push handles this)."
          fi
      - name: Wait for Render cold start
        run: sleep 60
      - name: Verify Health (attempt 1)
        run: |
          curl -f https://crufeeding-backend.onrender.com/health || echo "Health check pending — retrying..."
      - name: Wait and retry
        run: sleep 30
      - name: Verify Health (attempt 2)
        run: |
          curl -f https://crufeeding-backend.onrender.com/health || echo "Health check pending — Render may still be starting"
      - name: Wait and retry
        run: sleep 30
      - name: Verify Health (final)
        run: |
          curl -f https://crufeeding-backend.onrender.com/health && echo "Backend deployed OK" || echo "WARNING: Backend health check failed after 3 retries"
