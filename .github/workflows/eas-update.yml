name: EAS OTA Update

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  update:
    name: Publish OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production OTA (push to main)
        if: github.event_name == 'push'
        run: eas update --branch production --message "Production update from main" --non-interactive

      - name: PR Preview OTA (pull request)
        if: github.event_name == 'pull_request'
        run: eas update --branch pr-${{ github.event.number }} --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}" --non-interactive
