</head>
<body>

        <tr>
            <th></th>
            <th></th>
        </tr>
        <tr>
            <td></td>
            <td></td>
        </tr>
        <tr>
            <td></td>

            </tr>

             <table border="1" width="200" height="200">
        <tr>
            <th colspan="2"></th>
        </tr>
        <tr>
            <td rowspan="2"></td>
            <td></td>
        </tr>
            </table>
</body>
</html>
