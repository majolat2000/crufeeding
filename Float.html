<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Float Example</title>
    <style>
        .float-box {
            float: left;
            width: 200px;
            height: 150px;
            margin: 10px;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            line-height: 150px;
            font-size: 20px;
        }
        .content {
            margin-left: 220px;
            padding: 10px;
        }
        .clearfix::after {
            content: "";
            clear: both;
            display: table;
        }
    </style>
</head>
<body>
    <div class="clearfix">
        <div class="float-box">Floated Box</div>
        <div class="content">
            <p>
                This is some content that wraps around the floated box. The float property allows elements to be taken out of the normal flow and positioned to the left or right of their container, allowing text and inline elements to wrap around them.
            </p>
        </div>
    </div>
</body>
</html>
