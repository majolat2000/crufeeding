<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flexbox Example</title>
    <style>
        .container {
            display: flex;
            gap: 16px;
            padding: 20px;
            background: #f0f0f0;
        }
        .item {
            background: #4a90e2;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>
</body>
</html>
