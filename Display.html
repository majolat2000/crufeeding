<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" width="width=device-width, initial-scale=1.0" height="device-height">
    <title>Display Property</title>
    <style>
        .block-example {
            display: block;
            background: #e0e0e0;
            padding: 10px;
            margin-bottom: 10px;
        }
        .inline-example {
            display: inline;
            background: #b3d9ff;
            padding: 5px;
        }
        .inline-block-example {
            display: inline-block;
            background: #ffd699;
            padding: 10px;
            margin-right: 10px;
        }
        .none-example {
            display: none;
        }
    </style>
</head>
<body>
    <h1>HTML Display Property Examples</h1>
    <div class="block-example">This is a block element (div).</div>
    <span class="inline-example">This is an inline element (span).</span>
    <span class="inline-block-example">This is inline-block 1</span>
    <span class="inline-block-example">This is inline-block 2</span>
    <div class="none-example">You can't see me (display: none).</div>
</body>
</html>
